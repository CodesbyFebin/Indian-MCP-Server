services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcpserver}
      POSTGRES_USER: ${POSTGRES_USER:-mcpserver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcpserver-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../packages/contracts/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpserver} -d ${POSTGRES_DB:-mcpserver}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mcpserver}:${POSTGRES_PASSWORD:-mcpserver-dev-password}@postgres:5432/${POSTGRES_DB:-mcpserver}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    environment:
      PORT: 3002
      CONTROL_PLANE_URL: http://control-plane:3001
    ports:
      - "3002:3002"
    depends_on:
      - control-plane

volumes:
  postgres_data:
  redis_data:
