# .github/workflows/ci.yml
name: CI
on:
  pull_request:
    branches: [main, main]
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npx tsc --noEmit --pretty

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/mcpserver_test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_URL: http://localhost:3000
          AUTH_SERVER_URL: http://localhost:3000
          UPSTASH_REDIS_URL: https://test.redis.upstash.io
          UPSTASH_REDIS_TOKEN: test-token

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: npm run dev &
        env:
          NEXT_PUBLIC_URL: http://localhost:3000
          AUTH_SERVER_URL: http://localhost:3000
          DATABASE_URL: postgres://test:test@localhost:5432/mcpserver_test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop server
        if: always()
        run: kill $! || true
